# Levanta la solución completa (BFF en NestJS + app en Angular).
# Espera el repositorio del frontend clonado junto a este; se puede cambiar con FRONTEND_CONTEXT.
name: pokemon-explorer

services:
  backend:
    build: .
    image: pokemon-explorer-backend
    environment:
      PORT: 3000
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
      CACHE_TTL_SECONDS: 3600
      # Nivel: fatal | error | warn | log | debug | verbose. Formato: pretty | json
      LOG_LEVEL: ${LOG_LEVEL:-log}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build: ${FRONTEND_CONTEXT:-../sii-test-frontend}
    image: pokemon-explorer-frontend
    environment:
      BFF_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
